name: Flatter

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  flatter:
    name: Flatter
    container:
      image: ghcr.io/andyholmes/flatter/kde:6.10
      options: --privileged
      volumes:
        - /opt/hostedtoolcache:/hostedtoolcache

    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
      fail-fast: false
      # Only one job at a time can use the shared repository cache
      max-parallel: 1

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Free up disk space
        shell: bash
        run: |
          rm -rf /hostedtoolcache/*
          df -h

      # Checkout a repository with Flatpak manifests
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup GPG
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v5
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Install Flatpak dependencies
        run: |
          flatpak install --noninteractive org.freedesktop.Sdk.Extension.openjdk21/${{ matrix.arch }}/25.08
          flatpak install --noninteractive org.freedesktop.Sdk.Extension.openjdk17/${{ matrix.arch }}/25.08
          flatpak install --noninteractive org.freedesktop.Sdk.Extension.openjdk8/${{ matrix.arch }}/25.08
          flatpak install --noninteractive org.kde.Sdk/${{ matrix.arch }}/6.10
          flatpak install --noninteractive org.kde.Platform/${{ matrix.arch }}/6.10

      - name: Build
        uses: andyholmes/flatter@main
        with:
          files: |
            org.unmojang.FjordLauncher/org.unmojang.FjordLauncher.yml
          arch: ${{ matrix.arch }}
          gpg-sign: ${{ steps.gpg.outputs.fingerprint }}
          upload-bundles: true
          upload-pages-artifact: false

      - name: Upload per-arch repository
        uses: actions/upload-artifact@v4
        with:
          name: repo-${{ matrix.arch }}
          path: repo
          retention-days: 1

  merge:
    name: Merge & Publish
    runs-on: ubuntu-latest
    needs: flatter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download x86_64 repository
        uses: actions/download-artifact@v4
        with:
          name: repo-x86_64
          path: repo

      - name: Overlay aarch64 repository
        uses: actions/download-artifact@v4
        with:
          name: repo-aarch64
          path: repo

      - name: Copy Pages includes
        run: cp index.html repo/index.html

      - name: Generate flatpakref
        shell: bash
        run: |
          set -euo pipefail
          URL="$(sed -n 's/^Url=//p' repo/index.flatpakrepo | tr -d '[:space:]')"
          GPGKEY="$(sed -n 's/^GPGKey=//p' repo/index.flatpakrepo | tr -d '[:space:]')"
          if [ -z "$URL" ] || [ -z "$GPGKEY" ]; then
            echo "ERROR: Failed to extract Url or GPGKey from index.flatpakrepo"
            exit 1
          fi
          {
            echo '[Flatpak Ref]'
            echo 'Title=Fjord Launcher'
            echo 'Name=org.unmojang.FjordLauncher'
            echo 'Branch=master'
            echo "Url=${URL}"
            echo 'RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo'
            echo 'Homepage=https://github.com/unmojang/FjordLauncher'
            echo 'Icon=https://raw.githubusercontent.com/unmojang/FjordLauncher/develop/program_info/org.unmojang.FjordLauncher.svg'
            echo "GPGKey=${GPGKEY}"
            echo 'IsRuntime=false'
          } > repo/org.unmojang.FjordLauncher.flatpakref

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

  # See "Github Pages" below
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: merge
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
